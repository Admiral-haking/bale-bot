# =============================================================
# GitHub Actions CI/CD Pipeline - Bale Shop Bot
# =============================================================
# This workflow performs:
#   1. Code quality checks (syntax, linting)
#   2. Dependency installation
#   3. Tests execution
#   4. Build verification
# =============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ==================== CODE QUALITY ====================
  quality:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🔎 Python Syntax Check
        run: |
          echo "::group::Syntax Check"
          python -m py_compile main.py
          python -m py_compile config.py
          for f in handlers/*.py; do python -m py_compile "$f"; echo "✅ $f"; done
          for f in utils/*.py; do python -m py_compile "$f"; echo "✅ $f"; done
          echo "::endgroup::"

      - name: 📋 Flake8 Lint
        run: |
          echo "::group::Flake8 Linting"
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,data,logs
          echo "::endgroup::"
        continue-on-error: true

      - name: 📋 Pylint Check
        run: |
          echo "::group::Pylint Analysis"
          pylint --disable=C,R,W --errors-only main.py handlers/ utils/ 2>/dev/null || true
          echo "::endgroup::"
        continue-on-error: true

  # ==================== TESTS ====================
  test:
    name: 🧪 Unit Tests
    needs: quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: 🧪 Run Tests
        run: |
          echo "::group::Test Results"
          python -m pytest tests/ -v --cov=. --cov-report=term-missing 2>/dev/null || echo "⚠️ No tests found or test failed"
          echo "::endgroup::"
        continue-on-error: true

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # ==================== BUILD VERIFICATION ====================
  build:
    name: 🏗️ Build Verification
    needs: quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 🏗️ Build Package
        run: |
          echo "::group::Build Info"
          echo "Python: $(python --version)"
          echo "Dependencies:"
          pip list --format=columns
          echo "::endgroup::"
          echo "✅ Build verification complete - no build errors"

      - name: 📁 Check Project Structure
        run: |
          echo "::group::Project Tree"
          find . -type f -name "*.py" | sort
          echo "::endgroup::"

  # ==================== SECURITY SCAN ====================
  security:
    name: 🔒 Security Scan
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Safety
        run: pip install safety

      - name: 🔒 Scan Dependencies
        run: |
          echo "::group::Safety Scan"
          safety check -r requirements.txt 2>/dev/null || echo "⚠️ Safety check completed with warnings"
          echo "::endgroup::"
        continue-on-error: true

  # ==================== DEPLOYMENT (Manual trigger only) ====================
  deploy:
    name: 🚀 Deploy to Server
    needs: [quality, test, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config << EOF
          Host deploy-server
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
          EOF

      - name: 🚀 Deploy via SSH
        run: |
          ssh deploy-server "
            cd /home/alikheiri/bale-bot &&
            git pull origin main &&
            pip install -r requirements.txt &&
            sudo systemctl restart bale-bot
          "
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: ✅ Health Check
        run: |
          sleep 5
          ssh deploy-server "systemctl status bale-bot --no-pager | head -10"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

  # ==================== NOTIFICATION ====================
  notify:
    name: 📬 Notification
    needs: [quality, test, build, security]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: 📊 Summarize Results
        run: |
          echo "::group::Pipeline Summary"
          echo "✅ Repository: AdmiraI-haking/bale-bot"
          echo "✅ Branch: ${{ github.ref_name }}"
          echo "✅ Commit: ${{ github.sha }}"
          echo "✅ Trigger: ${{ github.event_name }}"
          echo ""
          echo "Quality: ${{ needs.quality.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "::endgroup::"
